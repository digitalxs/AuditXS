name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (bash -n + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check (bash -n)
        run: |
          set -e
          for f in auditxs setup.sh uninstall.sh gui/auditxs-gui scripts/updater.sh tests/smoke.sh lib/*.sh checks/*.sh; do
            bash -n "$f"
            echo "OK $f"
          done
      - name: ShellCheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck
          shellcheck --version
          shellcheck -S warning auditxs setup.sh uninstall.sh gui/auditxs-gui scripts/updater.sh tests/smoke.sh lib/*.sh checks/*.sh

  smoke:
    name: Smoke (${{ matrix.distro }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        distro:
          - debian:stable
          - ubuntu:24.04
          - fedora:latest
          - archlinux:latest
          - opensuse/leap:15.6
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke test in ${{ matrix.distro }}
        # The smoke test makes real changes and rolls them back, so it runs
        # inside a disposable container of each supported distribution.
        run: |
          docker run --rm -v "$PWD:/src" -w /src "${{ matrix.distro }}" \
            bash tests/smoke.sh
