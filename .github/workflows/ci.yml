name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (bash -n + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check (bash -n)
        run: |
          set -e
          for f in auditxs setup.sh uninstall.sh gui/auditxs-gui gui/auditxs-tui.sh install-gui.sh scripts/updater.sh tests/*.sh lib/*.sh checks/*.sh; do
            bash -n "$f"
            echo "OK $f"
          done
      - name: ShellCheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck
          shellcheck --version
          shellcheck -S warning auditxs setup.sh uninstall.sh gui/auditxs-gui gui/auditxs-tui.sh install-gui.sh scripts/updater.sh tests/*.sh lib/*.sh checks/*.sh

  unit:
    name: Unit & check tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: bash tests/unit.sh
      - name: Run fixture-based check tests
        run: bash tests/check_test.sh
      - name: Run web UI test (auth, CSRF, localhost binding)
        run: bash tests/web_test.sh
      - name: Qt GUI data-layer selftest (no display needed)
        run: AUDITXS_BIN="$PWD/auditxs" python3 gui/auditxs-qt.py --selftest
      - name: Qt/QML view load test (offscreen)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libdbus-1-3
          python3 -m pip install --quiet PySide6-Essentials
          AUDITXS_BIN="$PWD/auditxs" python3 tests/qml_test.py
      - name: Build the documentation site
        run: |
          python3 -m py_compile scripts/build-site.py
          python3 scripts/build-site.py
          test -s index.html && test -s docs/index.html && test -s docs/usage.html
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('packaging/com.digitalxs.auditxs.policy')"
      - name: Electron app checks (syntax + manifest, no heavy install)
        run: |
          node --check gui/electron/main.js
          node -e "JSON.parse(require('fs').readFileSync('gui/electron/package.json','utf8'))"

  package:
    name: Build & install .deb
    runs-on: ubuntu-latest
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@v4
      - name: Build the Debian package
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dpkg-dev
          ./packaging/build-deb.sh dist
      - name: Install and smoke-test the packaged build (debian container)
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:stable bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -q
            apt-get install -y -q ./dist/auditxs_*_all.deb
            command -v auditxs
            auditxs version
            auditxs list --framework cis >/dev/null
            auditxs audit --profile server --quiet --format json >/dev/null
            test -f /usr/share/man/man8/auditxs.8.gz
            apt-get purge -y -q auditxs
            echo "package install/run/purge OK"
          '
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: auditxs-deb
          path: dist/*.deb

  smoke:
    name: Smoke (${{ matrix.distro }})
    runs-on: ubuntu-latest
    needs: [lint, unit]
    strategy:
      fail-fast: false
      matrix:
        distro:
          - debian:stable
          - ubuntu:24.04
          - fedora:latest
          - archlinux:latest
          - opensuse/leap:15.6
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke test in ${{ matrix.distro }}
        # The smoke test makes real changes and rolls them back, so it runs
        # inside a disposable container of each supported distribution.
        run: |
          docker run --rm -v "$PWD:/src" -w /src "${{ matrix.distro }}" \
            bash tests/smoke.sh
